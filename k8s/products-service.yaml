apiVersion: v1
kind: Service
metadata:
  name: products-db
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: products-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-db
  namespace: microapp
  labels:
    app: products-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-db
  template:
    metadata:
      labels:
        app: products-db
    spec:
      containers:
        - name: products-db
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: products_db
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-proot", "--silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
# --- Microservicio de productos ---
apiVersion: v1
kind: Service
metadata:
  name: products-svc
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: products-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: microapp
  labels:
    app: products-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: sebastianvarona/products-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: PRODUCTS_DB_HOST
              value: products-db
            - name: PRODUCTS_DB_USER
              value: root
            - name: PRODUCTS_DB_PASSWORD
              value: root
            - name: PRODUCTS_DB_NAME
              value: products_db
            - name: CONSUL_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 5
      restartPolicy: Always

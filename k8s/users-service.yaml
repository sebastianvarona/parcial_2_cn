apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: users-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  namespace: microapp
  labels:
    app: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: users-db
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: users_db
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-proot", "--silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
# --- Microservicio de usuarios ---
apiVersion: v1
kind: Service
metadata:
  name: users-svc
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: users-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: microapp
  labels:
    app: users-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: sebastianvarona/users-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: USERS_DB_HOST
              value: users-db
            - name: USERS_DB_USER
              value: root
            - name: USERS_DB_PASSWORD
              value: root
            - name: USERS_DB_NAME
              value: users_db
            - name: CONSUL_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 5
      restartPolicy: Always

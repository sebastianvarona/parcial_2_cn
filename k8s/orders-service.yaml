apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: orders-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: microapp
  labels:
    app: orders-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: orders-db
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: orders_db
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-proot", "--silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
# --- Microservicio de órdenes ---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: microapp
spec:
  type: ClusterIP
  selector:
    app: orders-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: microapp
  labels:
    app: orders-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: sebastianvarona/orders-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: ORDERS_DB_HOST
              value: orders-db
            - name: ORDERS_DB_USER
              value: root
            - name: ORDERS_DB_PASSWORD
              value: root
            - name: ORDERS_DB_NAME
              value: orders_db
            - name: PRODUCTS_SERVICE_URL
              value: http://products-svc:3002
            - name: CONSUL_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 5
      restartPolicy: Always

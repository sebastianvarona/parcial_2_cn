global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Cifrado SSL por defecto
    ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
    ssl-default-bind-options no-sslv3

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# --
# Frontend principal: escucha en el puerto 80 y enruta por ruta
# --
frontend http_front
    bind *:80

    # ACLs de enrutamiento por prefijo de ruta
    acl is_users    path_beg /api/users
    acl is_products path_beg /api/products
    acl is_orders   path_beg /api/orders

    use_backend users_back    if is_users
    use_backend products_back if is_products
    use_backend orders_back   if is_orders

    default_backend users_back

# --
# Backends (round-robin entre dos instancias de cada servicio)
# --
backend users_back
    balance roundrobin
    option  httpchk GET /health
    server users1 192.168.100.4:3001 check
    server users2 192.168.100.4:3011 check

backend products_back
    balance roundrobin
    option  httpchk GET /health
    server products1 192.168.100.4:3002 check
    server products2 192.168.100.4:3012 check

backend orders_back
    balance roundrobin
    option  httpchk GET /health
    server orders1 192.168.100.4:3003 check
    server orders2 192.168.100.4:3013 check

# --
# Página de estadísticas en puerto dedicado (8080)
# --
listen stats
    bind *:8080
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:admin
    stats admin if TRUE

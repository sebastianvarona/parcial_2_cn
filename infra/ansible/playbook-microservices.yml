---
- name: Configurar vm-microservices
  hosts: microservices
  become: true
  vars:
    deploy_dir: /opt/microapp

  tasks:
    - name: Instalar prerequisitos
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Crear directorio de keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Agregar llave GPG de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Agregar repositorio de Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Instalar Docker Engine y Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Habilitar e iniciar el servicio Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Crear directorio de despliegue
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Copiar docker-compose de producción
      ansible.builtin.copy:
        src: ../../docker-compose.prod.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Descargar y levantar los contenedores
      ansible.builtin.shell:
        cmd: docker compose up -d --pull always
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: "'Created' in compose_up.stdout or 'Started' in compose_up.stdout"

    - name: Mostrar contenedores corriendo
      ansible.builtin.command: docker ps
      register: docker_ps
      changed_when: false

    - name: Imprimir docker ps
      ansible.builtin.debug:
        var: docker_ps.stdout_lines

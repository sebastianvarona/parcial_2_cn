<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { padding-top: 50px; padding-bottom: 20px; }
        .navbar { margin-bottom: 20px; }
        .items-table { margin-bottom: 0; }
        .items-table th { font-size: 0.85rem; }
        .items-table td { font-size: 0.85rem; }
        .order-row { cursor: pointer; }
        .detail-row td { padding: 0; border-top: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="/dashboard">Store Management</a>
</nav>
<div class="container">
    <h2>My Orders</h2>
    <table id="orders-list" class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Email</th>
                <th>Total</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button type="button" onclick="getOrders()" class="btn btn-primary">Load Orders</button>
</div>
<script src="/static/scriptOrders.js"></script>
</body>
</html>
